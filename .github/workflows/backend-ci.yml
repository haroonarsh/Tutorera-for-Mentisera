name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "tutorera-backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "tutorera-backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validate:
    name: Backend validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorera-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorera-backend/package-lock.json

      - name: Refresh lockfile for type-package cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup-types-20261006'
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh backend lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Marketplace tests
        run: npm run test:marketplace
