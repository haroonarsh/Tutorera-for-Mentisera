name: Deploy Backend to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'tutorera-backend/**'
      - 'cloudflare/backend/**'
      - 'scripts/ci/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backend-production
    env:
      CLOUDFLARE_ACCOUNT_ID: e0f40de5e1f6ab0e29c9b1cb3f9a7102
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: false
      SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tutorera-backend/package-lock.json
            cloudflare/backend/package-lock.json
      - name: Require payment migration completed
        run: |
          node --input-type=module -e "import {requireSettings} from './scripts/ci/release-checks.mjs'; requireSettings(process.env,['CLOUDFLARE_API_TOKEN','GITHUB_SHA']);"
          node --input-type=module -e "import fs from 'node:fs'; import {checkPaymentRelease} from './cloudflare/backend/scripts/payment-release-policy.mjs'; checkPaymentRelease(JSON.parse(fs.readFileSync('cloudflare/backend/wrangler.jsonc','utf8')).env.production.vars);"
      - run: npm ci
        working-directory: tutorera-backend
      - run: npm run build
        working-directory: tutorera-backend
      - run: npm test
        working-directory: tutorera-backend
      - run: node --test scripts/ci/release-checks.test.mjs
      - run: npm ci
        working-directory: cloudflare/backend
      - name: Deploy to Cloudflare Workers (production)
        run: npm run deploy:production
        working-directory: cloudflare/backend
      - name: Sync secrets to Cloudflare Worker
        working-directory: cloudflare/backend
        run: |
          sync_secret() {
            local name="$1"; local value="$2"
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name" --env production
            fi
          }
          sync_secret MONGO_URI             "$MONGO_URI"
          sync_secret JWT_SECRET            "$JWT_SECRET"
          sync_secret CLOUDINARY_CLOUD_NAME "$CLOUDINARY_CLOUD_NAME"
          sync_secret CLOUDINARY_API_KEY    "$CLOUDINARY_API_KEY"
          sync_secret CLOUDINARY_API_SECRET "$CLOUDINARY_API_SECRET"
          sync_secret EMAIL_USER            "$EMAIL_USER"
          sync_secret EMAIL_PASS            "$EMAIL_PASS"
      - name: Verify production health
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://api.tutorera.ac.pk/health/ready
      - name: Deployment success notification
        if: success() && env.SLACK_WEBHOOK_DEPLOY != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          payload: '{"text":"Backend deployed successfully to Cloudflare Workers. Commit: ${{ github.sha }}"}'
      - name: Deployment failure notification
        if: failure() && env.SLACK_WEBHOOK_DEPLOY != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          payload: '{"text":"Backend deployment to Cloudflare Workers failed. Commit: ${{ github.sha }}. Check GitHub Actions logs."}'
