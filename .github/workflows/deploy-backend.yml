name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths: ['tutorera-backend/**', 'scripts/ci/**', 'cloudflare/backend/payment-release-policy.json', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: backend-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backend-production
    env:
      RENDER_SERVICE_ID: srv-d82n6thkh4rs73fef0mg
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorera-backend/package-lock.json
      - name: Require deployment settings and completed payment migration
        run: |
          node --input-type=module -e "import {requireSettings} from './scripts/ci/release-checks.mjs'; requireSettings(process.env,['RENDER_SERVICE_ID','RENDER_API_KEY','GITHUB_SHA']);"
          node --input-type=module -e "import fs from 'node:fs'; import {checkPaymentRelease} from './cloudflare/backend/scripts/payment-release-policy.mjs'; checkPaymentRelease(JSON.parse(fs.readFileSync('cloudflare/backend/wrangler.jsonc','utf8')).env.production.vars);"
      - run: npm ci
        working-directory: tutorera-backend
      - run: npm run build
        working-directory: tutorera-backend
      - run: npm test
        working-directory: tutorera-backend
      - run: node --test scripts/ci/release-checks.test.mjs
      - name: Deploy exact commit, wait for live state, verify database readiness
        run: node scripts/ci/deploy-render.mjs
      - name: Existing deployment success notification
        if: success() && env.SLACK_WEBHOOK_DEPLOY != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          payload: '{"text":"Backend deployed successfully to Render. Commit: ${{ github.sha }}"}'
      - name: Existing deployment failure notification
        if: failure() && env.SLACK_WEBHOOK_DEPLOY != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          payload: '{"text":"Backend deployment failed. Commit: ${{ github.sha }}. Check GitHub Actions logs."}'
