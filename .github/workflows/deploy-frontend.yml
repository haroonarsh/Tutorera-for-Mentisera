name: Deploy Frontend to Cloudflare

on:
  push:
    branches: [main]
    paths: ['tutorera-frontend/**', 'scripts/ci/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: frontend-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: frontend-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e0f40de5e1f6ab0e29c9b1cb3f9a7102
      NEXT_PUBLIC_API_URL: https://api.tutorera.ac.pk/api/v1
      NODE_OPTIONS: --max-old-space-size=6144
      WRANGLER_SEND_METRICS: false
      SLACK_WEBHOOK_DEPLOY: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
    defaults:
      run:
        working-directory: tutorera-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorera-frontend/package-lock.json
      - name: Require deployment credentials
        run: node --input-type=module -e "import {requireSettings} from '../scripts/ci/release-checks.mjs'; requireSettings(process.env,['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID']);"
      - run: npm ci
      - name: Release guard regression tests
        run: node --test ../scripts/ci/release-checks.test.mjs
      - run: npm run lint
      - name: Build Next and OpenNext once
        run: npx opennextjs-cloudflare build
      - name: Deploy the verified build
        run: node --env-file-if-exists=../.env.cloudflare.local ./node_modules/@opennextjs/cloudflare/dist/cli/index.js deploy
      - name: Verify public routes (fail on timeout)
        run: node ../scripts/ci/check-frontend.mjs
      - name: Existing deployment success notification
        if: success() && env.SLACK_WEBHOOK_DEPLOY != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          payload: '{"text":"Frontend deployed successfully to https://tutorera.ac.pk. Commit: ${{ github.sha }}"}'
      - name: Existing deployment failure notification
        if: failure() && env.SLACK_WEBHOOK_DEPLOY != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          payload: '{"text":"Frontend deployment failed. Commit: ${{ github.sha }}. Check GitHub Actions logs."}'
