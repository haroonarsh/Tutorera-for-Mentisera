name: Lint Cleanup Codemod

on:
  push:
    branches: [chore/lint-warning-cleanup]
    paths:
      - "tutorera-frontend/scripts/remove-unused-imports.mjs"
      - "tutorera-frontend/scripts/fix-nonimage-lint-warnings.mjs"
      - ".github/workflows/lint-cleanup-codemod.yml"

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorera-frontend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/lint-warning-cleanup
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorera-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fix targeted non-image warnings
        run: node scripts/fix-nonimage-lint-warnings.mjs

      - name: Remove unused imports
        run: node scripts/remove-unused-imports.mjs

      - name: Run lint after cleanup
        run: npm run lint

      - name: Commit codemod changes
        run: |
          if git diff --quiet -- src; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore(lint): fix non-image warnings"
          git push origin HEAD:chore/lint-warning-cleanup
