name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "tutorera-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, chore/unified-tutorera-backend]
    paths:
      - "tutorera-frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorera-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tutorera-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.tutorera.ac.pk/api/v1
        run: npm run build
