name: Resolve Upstream Main Conflicts

on:
  push:
    branches: [seo/tutor-quality-cloudflare-cleanup]
    paths:
      - ".github/workflows/resolve-upstream-main.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEO branch
        uses: actions/checkout@v5
        with:
          ref: seo/tutor-quality-cloudflare-cleanup
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge current upstream main safely
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/haroonarsh/Tutorera-for-Mentisera.git
          git fetch upstream main

          if git merge --no-commit --no-ff upstream/main; then
            echo "Upstream main merged without content conflicts."
          else
            echo "Resolving only the known stale SEO-branch conflicts in favor of current upstream main."
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts detected:\n%s\n' "${conflicts[*]}"

            for file in "${conflicts[@]}"; do
              case "$file" in
                "tutorera-frontend/src/app/tutors/[id]/layout.tsx")
                  # Upstream intentionally removed this route-level layout. Preserve that deletion.
                  git rm -- "$file"
                  ;;
                "tutorera-frontend/src/app/(countries)/[countryCode]/layout.tsx"|\
                "tutorera-frontend/src/app/(countries)/[countryCode]/page.tsx"|\
                "tutorera-frontend/src/app/(countries)/[countryCode]/tutors/page.tsx"|\
                "tutorera-frontend/src/app/page.tsx"|\
                "tutorera-frontend/src/app/sitemap.ts"|\
                "tutorera-frontend/src/app/tutors/[id]/page.tsx"|\
                "tutorera-frontend/src/components/Tutors/SeoTutorDirectory.tsx"|\
                "tutorera-frontend/src/components/marketplace/OfferComparisonModal.tsx")
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected conflict: $file"
                  exit 1
                  ;;
              esac
            done
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Fix blocking lint errors inherited from upstream main
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # Next.js internal navigation must use next/link.
          payments = "tutorera-frontend/src/app/admin/payments/page.tsx"
          replace(
              payments,
              'import { useSearchParams } from "next/navigation";\n',
              'import { useSearchParams } from "next/navigation";\nimport Link from "next/link";\n',
          )
          replace(
              payments,
              '''<a\n                              href="/admin/payouts"\n                              style={{ padding: '0.5rem', backgroundColor: STATUS_COLORS.success.color, color: UI_COLORS.surface, borderRadius: '0.4rem', fontSize: '0.8rem', fontWeight: '600', textAlign: 'center', textDecoration: 'none' }}>\n                              Open payout operations\n                            </a>''',
              '''<Link\n                              href="/admin/payouts"\n                              style={{ padding: '0.5rem', backgroundColor: STATUS_COLORS.success.color, color: UI_COLORS.surface, borderRadius: '0.4rem', fontSize: '0.8rem', fontWeight: '600', textAlign: 'center', textDecoration: 'none' }}>\n                              Open payout operations\n                            </Link>''',
          )

          tax = "tutorera-frontend/src/app/admin/tax-config/page.tsx"
          replace(
              tax,
              'import { useEffect, useState } from "react";\n',
              'import { useEffect, useState } from "react";\nimport Link from "next/link";\n',
          )
          replace(
              tax,
              '<a href="/admin/fee-config" style={{ color: UI_COLORS.accent, fontWeight: 600 }}>Fee Configuration</a>',
              '<Link href="/admin/fee-config" style={{ color: UI_COLORS.accent, fontWeight: 600 }}>Fee Configuration</Link>',
          )

          # Avoid direct mutation of window.location under React's immutability lint rule.
          for guide in (
              "tutorera-frontend/src/app/student/guidebook/page.tsx",
              "tutorera-frontend/src/app/tutor/guidebook/page.tsx",
          ):
              replace(
                  guide,
                  "    window.location.hash = anchor;",
                  '    window.history.replaceState(null, "", `#${anchor}`);',
              )

          comparison = "tutorera-frontend/src/components/marketplace/OfferComparisonModal.tsx"
          replace(
              comparison,
              '<a href="/terms" style={{ color: "#0329b2" }}>Terms of Service</a>',
              '<Link href="/terms" style={{ color: "#0329b2" }}>Terms of Service</Link>',
          )
          replace(
              comparison,
              '<a href="/guarantee" style={{ color: "#0329b2" }}>Satisfaction Guarantee</a>',
              '<Link href="/guarantee" style={{ color: "#0329b2" }}>Satisfaction Guarantee</Link>',
          )

          quick = "tutorera-frontend/src/components/marketplace/QuickRequestComposer.tsx"
          replace(
              quick,
              'import { useRouter } from "next/navigation";\n',
              'import { useRouter } from "next/navigation";\nimport Link from "next/link";\n',
          )
          replace(
              quick,
              '<a href="/opportunities" style={{ color: "#0329b2", fontWeight: 700, textDecoration: "underline" }}>Find students who need what you teach</a>',
              '<Link href="/opportunities" style={{ color: "#0329b2", fontWeight: 700, textDecoration: "underline" }}>Find students who need what you teach</Link>',
          )
          PY

          # This workflow is a one-off resolver and must not remain in the PR.
          rm -f .github/workflows/resolve-upstream-main.yml
          git add -A
          git commit -m "Merge upstream main and resolve stale SEO conflicts"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutorera-frontend/package-lock.json

      - name: Install dependencies
        working-directory: tutorera-frontend
        run: npm ci

      - name: Lint
        working-directory: tutorera-frontend
        run: npm run lint

      - name: Build Next.js
        working-directory: tutorera-frontend
        run: npm run build

      - name: Build Cloudflare Worker
        working-directory: tutorera-frontend
        run: npx opennextjs-cloudflare build

      - name: Push validated merge commit
        run: git push origin HEAD:seo/tutor-quality-cloudflare-cleanup
